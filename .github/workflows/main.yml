name: main

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: github_actions
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # Calibration is vendored under api/calibration; no Git-based rcal install is needed.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run migrations
        run: python manage.py migrate
      - name: Run Django tests
        # PYTHONHASHSEED=0 pins Python's hash randomization so that set
        # iteration order is deterministic. The vendored calibration algorithm
        # enumerates unordered sets when building its linear system, which makes
        # TestCalibratedRatingsView flaky under the default random seed.
        env:
          PYTHONHASHSEED: "0"
        run: python manage.py test
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: "true"
        run: npm test -- --watchAll=false --runInBand
      - name: Build production Docker image
        # Keep this after the backend and frontend test suites so a frontend
        # build failure does not prevent backend migrations and tests from running.
        run: docker build --tag dcopenbk:ci .
