<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ heading }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f8fafc;-webkit-text-size-adjust:100%;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;background-color:#f8fafc;">
    <tr>
      <td align="center" style="padding:0;">
        {% include "email/tickets/_header.html" %}
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;max-width:600px;">
          <tr>
            <td style="padding:28px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;background-color:#ffffff;border:1px solid #e2e8f0;border-radius:12px;">
                <tr>
                  <td style="padding:28px 24px 24px;font-family:Inter,Segoe UI,Arial,sans-serif;">
                    <h1 style="margin:0 0 16px;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:22px;font-weight:600;line-height:1.3;color:#0d1b3e;letter-spacing:-0.02em;">
                      {{ heading }}
                    </h1>
                    {% for paragraph in paragraphs %}
                    <p style="margin:0 0 16px;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px;line-height:1.5;color:#0d1b3e;">
                      {{ paragraph }}
                    </p>
                    {% endfor %}
                    {% if cta_url %}
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;margin-top:8px;">
                      <tr>
                        <td align="left" style="border-radius:8px;background-color:#0f2a4a;">
                          <a href="{{ cta_url }}" style="display:inline-block;padding:12px 20px;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:700;line-height:1.35;color:#ffffff;text-decoration:none;text-transform:uppercase;letter-spacing:-0.01em;border-radius:8px;">
                            {{ cta_label }}
                          </a>
                        </td>
                      </tr>
                    </table>
                    {% endif %}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;margin-top:8px;">
          <tr>
            <td align="center" style="padding:0 28px 32px;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.5;color:#64748b;">
              {{ site_name }} &middot; Questions? Just reply to this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
